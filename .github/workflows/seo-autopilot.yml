# SEO Autopilot
# Every Monday 9:00 AM IST:
#   - First Monday of the month -> FIX mode: analyse + fix code + build check + push live (or PR if build fails)
#   - Other Mondays             -> REPORT mode: analyse only, no code changes
# Report: short plain-text email + branded PDF (all data) attached.
name: SEO Autopilot

on:
  schedule:
    - cron: "30 3 * * 1"   # Monday 03:30 UTC = 09:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = fix on first Monday of month, report otherwise"
        type: choice
        options: [auto, report, fix]
        default: auto

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: seo-autopilot
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide mode
        id: meta
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DAY=$(date -u +%d)
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            if [ "$((10#$DAY))" -le 7 ]; then MODE=fix; else MODE=report; fi
          fi
          # Sites that are not Next.js: set repo variable SEO_MODE=report -> never change code
          if [ "${{ vars.SEO_MODE }}" = "report" ]; then MODE=report; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "branch=seo/update-$DATE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          REPORT_DATE: ${{ steps.meta.outputs.date }}
        run: |
          pip install --quiet google-api-python-client google-auth markdown
          python scripts/seo/fetch_gsc.py

      # ---------- REPORT MODE ----------
      - name: Claude - weekly report only
        if: steps.meta.outputs.mode == 'report'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep,Skill,Bash(git log:*)"
          prompt: |
            Weekly SEO REPORT for this website. Use the nextjs-seo-fixer skill, keyword analysis mode
            only (references/search-console.md). This week you must NOT change any website code.

            1. Read seo-reports/data/latest.json (last 28 days = "current", 28 days before = "previous").
            2. To see what the monthly fix changed recently, run:
               git log --since="45 days ago" --author="seo-bot" --name-only --pretty=format:"%ad %s" --date=short
               and note whether pages changed
               in earlier fixes are improving (use earlier_fixes).
            3. Write ONLY a short insights file to seo-reports/insights-${{ steps.meta.outputs.date }}.json.
               The PDF tables and numbers are built automatically from the data, so do NOT repeat tables or
               numbers lists. The reader is a busy business owner (clinic, law firm, NGO, etc.): simple English, no technical words (no git,
               file names, code, schema, CTR, SERP), each point very short (max 12 words), like a bullet point, no explanations, only
               facts from the data. Valid JSON with exactly these keys:
               {"verdict": "good" | "okay" | "needs_attention",
                "headline": "one short sentence (max 18 words): the most important thing",
                "wins": [max 3], "problems": [max 3],
                "next_actions_agency": [max 3, what SparkSkylytics will do next],
                "next_actions_owner": [max 3, what the business team can do, e.g. Google reviews],
                "changes_made": [ {"page": "page name in plain words", "change": "what was improved (max 12 words)",
                                   "keywords": ["the exact search terms this change targets, from the data"]} ],
                "earlier_fixes": [ {"page": "...", "result": "kept" | "waiting" | "restored", "note": "short"} ]}
               In report mode, changes_made must be an empty list.
            Only write that one file.

      # ---------- FIX MODE ----------
      - name: Claude - monthly analysis and code fixes
        if: steps.meta.outputs.mode == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 70
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(ls:*)"
          prompt: |
            Monthly SEO FIX for this website. Use the nextjs-seo-fixer skill and follow both modes. First check package.json:
            Next.js -> Next.js patterns; Vite/React SPA -> references/vite-react-spa.md.

            1. Read seo-reports/data/latest.json (last 28 days = "current", 28 days before = "previous")
               (earlier reports are not stored in the repo; use git history instead).
            2. Find recently changed files:
               git log --since="28 days ago" --author="seo-bot" --name-only --pretty=format:"%ad %s" --date=short
               4-WEEK RULE: do not change the title, description, H1 or main content of any page that was
               changed in that period. Google needs time to react. Technical fixes (broken schema, missing
               alt text, sitemap errors) are still allowed.
            3. Check earlier fixes first. For every page seo-bot changed 4 or more weeks ago, compare its
               numbers before vs after (impressions, clicks, position of its keywords):
               - improved -> KEEP it, do not touch that page;
               - no clear change -> leave it one more month (small sites need time);
               - clearly worse (position dropped 3+ places or clicks fell) -> RESTORE the old version of the
                 changed parts (use git log / git show to see the old text) and note it in the report.
            4. Change a page ONLY when the data gives a clear reason, for example:
               - keyword on page 1 (position 1-10) with 10+ impressions but almost no clicks -> improve
                 title and description (CTR problem);
               - keyword at position 8-20 with 10+ impressions -> strengthen that page's title, H1 and content;
               - brand search (clinic or doctor name) not at position 1-2 -> fix brand signals;
               - technical errors (missing title/description, broken or missing schema, missing alt text,
                 sitemap problems) -> always fix.
               If the data is too small (under ~200 impressions in 28 days), only fix technical errors.
               Do not make changes "just to change something". If nothing meets these rules, change no code.
               Then do the keyword analysis and keyword-to-page map, and make the fixes.
            5. Safety rules: keep the design; make focused changes (max about 8 files); do not invent phone
               numbers, addresses, reviews, ratings, prices or medical claims; do not delete pages; do not
               add new npm packages; do not touch .github/, scripts/, .env files or package.json; do not run
               git commit/push (the workflow does that). The code must still build with `npm run build`, so
               keep imports (and "use client" boundaries in Next.js) correct. If nothing needs changing, change no code.
            6. Write ONLY a short insights file to seo-reports/insights-${{ steps.meta.outputs.date }}.json.
               The PDF tables and numbers are built automatically from the data, so do NOT repeat tables or
               numbers lists. The reader is a busy business owner (clinic, law firm, NGO, etc.): simple English, no technical words (no git,
               file names, code, schema, CTR, SERP), each point very short (max 12 words), like a bullet point, no explanations, only
               facts from the data. Valid JSON with exactly these keys:
               {"verdict": "good" | "okay" | "needs_attention",
                "headline": "one short sentence (max 18 words): the most important thing",
                "wins": [max 3], "problems": [max 3],
                "next_actions_agency": [max 3, what SparkSkylytics will do next],
                "next_actions_owner": [max 3, what the business team can do, e.g. Google reviews],
                "changes_made": [ {"page": "page name in plain words", "change": "what was improved (max 12 words)",
                                   "keywords": ["the exact search terms this change targets, from the data"]} ],
                "earlier_fixes": [ {"page": "...", "result": "kept" | "waiting" | "restored", "note": "short"} ]}
               changes_made must list every page you changed this run (empty list if none).

      - name: Check for code changes
        id: changes
        if: steps.meta.outputs.mode == 'fix'
        run: |
          CHANGED=$(git status --porcelain -- . ':!seo-reports' ':!.github' ':!scripts' | wc -l)
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed code files: $CHANGED"

      - name: Set up Node
        if: steps.meta.outputs.mode == 'fix' && steps.changes.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build check (safety)
        id: build
        if: steps.meta.outputs.mode == 'fix' && steps.changes.outputs.count != '0'
        continue-on-error: true
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -n "$BUILD_ENV" ]; then printf '%s\n' "$BUILD_ENV" > .env.local; fi
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          rm -f .env.local

      - name: Commit and push
        id: push
        if: steps.meta.outputs.mode == 'fix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          DATE: ${{ steps.meta.outputs.date }}
          PUSH_MODE: ${{ vars.SEO_PUSH_MODE }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CODE_CHANGES: ${{ steps.changes.outputs.count }}
        run: |
          rm -f .env.local
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git add -A
          git reset -q -- .github scripts .env.local .env seo-reports node_modules .next 2>/dev/null || true   # client data never committed (public repos)
          if git diff --cached --quiet; then
            echo "result=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "SEO monthly update ${DATE}"


          if [ "$PUSH_MODE" != "pr" ] && [ "$BUILD_OUTCOME" = "success" ]; then
            git push origin "HEAD:${DEFAULT_BRANCH}"
            SHA=$(git rev-parse HEAD)
            echo "result=live" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/${{ github.repository }}/commit/${SHA}" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
            if [ "$BUILD_OUTCOME" = "success" ]; then
              BODY="Monthly SEO update by Claude. Build passed. The PDF report was emailed."
              echo "result=pr" >> "$GITHUB_OUTPUT"
            else
              BODY="Monthly SEO update by Claude. BUILD FAILED, so it was NOT pushed live. Please check."
              echo "result=build_failed" >> "$GITHUB_OUTPUT"
            fi
            URL=$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "SEO update ${DATE}" --body "$BODY")
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PDF tools
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core > /dev/null
          pip install --quiet weasyprint markdown
          mkdir -p ~/.local/share/fonts
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o ~/.local/share/fonts/Poppins-$w.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-$w.ttf" || true
          done
          fc-cache -f > /dev/null

      - name: Send report by email (with PDF)
        if: always()
        env:
          AGENCY_NAME: ${{ vars.AGENCY_NAME }}
          AGENCY_WEBSITE: ${{ vars.AGENCY_WEBSITE }}
          AGENCY_PHONE: ${{ vars.AGENCY_PHONE }}
          AGENCY_EMAIL: ${{ vars.AGENCY_EMAIL }}
          BRAND_COLOR: ${{ vars.BRAND_COLOR }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          MODE: ${{ steps.meta.outputs.mode }}
          REPORT_DATE: ${{ steps.meta.outputs.date }}
          PUSH_RESULT: ${{ steps.push.outputs.result }}
          LINK_URL: ${{ steps.push.outputs.url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: PYTHONPATH=scripts/seo python scripts/seo/notify.py
